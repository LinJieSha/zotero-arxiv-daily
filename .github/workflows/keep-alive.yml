name: Keep Alive

on:
  workflow_dispatch:
  # 与主 workflow 同理：fork 的 schedule 被禁用，靠外部 API 触发。
  # 这个 workflow 的作用是产生 commit 防止仓库 60 天无活动被停用定时任务，
  # 所以必须能被触发，否则它自己也救不了自己。
  repository_dispatch:
    types: [keep-alive]
  schedule:
    # 每 30 天一次（若 GitHub 放开 fork 限制则自动生效）
    - cron: '0 0 */30 * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update keep-alive file
        run: |
          mkdir -p .github
          echo "Last run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive.txt
          echo "This file is automatically updated to keep the repository active and prevent GitHub Actions from disabling scheduled workflows." >> .github/keep-alive.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update keep-alive timestamp [skip ci]"
            git push
          fi
