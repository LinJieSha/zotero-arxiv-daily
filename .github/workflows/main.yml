name: Send emails twice a week
# concurrency：同一时刻只允许一个推送 run（后进的取消先进的），防止重复邮件
concurrency:
  group: paper-push
  cancel-in-progress: true
on:
  workflow_dispatch:
  # 推送由本机计划任务触发（周二/周五 10:00 + 开机/登录兜底），走 repository_dispatch：
  # 一天只派发一次；送达由本机脚本回查本 run 日志确认，失败才补发一次。
  repository_dispatch:
    types: [scheduled-run]
  # ⚠️ 这里刻意不写 schedule/cron —— 2026-10-16 实测教训：
  #    "fork 上 schedule 不生效"的前提是 Actions 被整体禁用；一旦在网页端点过
  #    "I understand my workflows, go ahead and re-enable them"，cron 会立刻复活，
  #    绕过本机脚本的单日一推/送达回查，变成每天一封、时间不可控（当天原定 04:00 UTC，
  #    GitHub 延迟到 08:48 UTC 才跑，凭空多出一封计划外邮件）。
  #    推送时刻的唯一来源 = 本机计划任务（见 trigger_workflow.ps1 / setup_scheduler.ps1）。

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    # sent_history 回写步骤需要 push 权限（与 keep-alive.yml 同理；
    # 默认 GITHUB_TOKEN 是只读的，不声明这行 git push 会 403）
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          set +e
          uv run src/zotero_arxiv_daily/main.py 2>&1 | tee pipeline.log
          status=${PIPESTATUS[0]}
          set -e
          # 把结果写进 run summary 与环境，供本机脚本回查与人工快速判断：
          # 0papers / email-sent / failed(n)
          # 注意：这里不再做 GitHub 侧自重试 —— 单日一推与失败补发
          # 由 trigger_workflow.ps1 统一负责（2026-10-15 恢复原始规划）。
          if grep -q 'Total 0 papers retrieved' pipeline.log; then RESULT=0papers
          elif grep -q 'No arxiv papers found' pipeline.log; then RESULT=0papers
          elif grep -q 'Email sent successfully' pipeline.log; then RESULT=email-sent
          else RESULT="failed($status)"; fi
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "### Run result: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # ---------------------------------------------------------------------------
      # sent_history 回写：发信成功后把 sent_history.json commit 回仓库。
      # 下次 run checkout 读到它，检索层即可跳过已推送过的论文 —— 这是跨 run
      # 去重的持久层（宽回看窗口 + 捞回漏推批次且不重复，全靠它）。
      # 没发信 / 失败都不 commit：失败重推时这些论文仍是"未推送"。
      # ---------------------------------------------------------------------------
      - name: Commit sent history if email was sent
        if: env.RESULT == 'email-sent'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if git diff --staged --quiet; then
            echo "No sent_history changes to commit"
          else
            git commit -m "chore: update sent history [skip ci]"
            git push
          fi
# touch: re-register workflow (2026-10-15)
