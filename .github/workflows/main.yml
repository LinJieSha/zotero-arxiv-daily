name: Send emails twice a week
on:
  workflow_dispatch:
  # GitHub 禁用 fork 仓库的 schedule（定时任务），但允许外部通过 API 推送
  # repository_dispatch 事件触发。这条路径已实测可用（HTTP 204）。
  # 由 Windows 任务计划程序在每周一/周四 14:00 调 API 触发。
  repository_dispatch:
    types: [scheduled-run]
  schedule:
    # 保留原 cron：若将来 GitHub 放开 fork 限制，或仓库脱离 fork 网络，可直接生效
    # 每周一、周四 北京时间 14:00（GitHub cron 固定用 UTC，北京 = UTC+8）
    - cron: '0 6 * * 1,4'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
